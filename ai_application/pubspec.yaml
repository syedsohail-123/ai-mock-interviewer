name: ai_application
description: "AI-Powered Mock Interview & CV Generator Desktop App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.5
  go_router: ^14.1.4
  dio: ^5.4.3+1
  web_socket_channel: ^3.0.0
  file_picker: ^8.0.3
  record: ^5.1.2
  path_provider: ^2.1.3
  intl: ^0.19.0
  google_fonts: ^6.2.1
  equatable: ^2.0.5
  uuid: ^4.4.0
  camera: ^0.12.0+2
  camera_platform_interface: ^2.6.0
  camera_windows: ^0.2.5
  win32: ^5.15.0
  ffi: ^2.1.2
  pdf: ^3.11.1
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true
